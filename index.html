<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xevapp</title>
<meta name="description" content="Xevapp: organiza tu vida, rutinas, ahorro y negocio.">
<meta name="theme-color" content="#F5F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Xevapp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#F5F3EF;--card:#FBFAF8;--card2:#F0EDE7;--text:#2B2D33;--text2:#6B6F78;--sep:rgba(43,45,51,.08);
  --blue:#5F82B4;--sage:#6FA88A;--sand:#C99A5E;--rose:#C97B7B;--lav:#9585C2;
  --blue-s:rgba(95,130,180,.12);--sage-s:rgba(111,168,138,.14);--sand-s:rgba(201,154,94,.15);--rose-s:rgba(201,123,123,.14);--lav-s:rgba(149,133,194,.14);
  --glass:rgba(245,243,239,.72);--shadow:0 1px 2px rgba(43,45,51,.04),0 8px 24px rgba(43,45,51,.06);
  --r:24px;--r-sm:14px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
}
html[data-theme="dark"]{
  --bg:#16181D;--card:#1F2229;--card2:#272A32;--text:#E8E6E1;--text2:#9A9EA8;--sep:rgba(232,230,225,.08);
  --blue:#86A3CF;--sage:#8DC2A6;--sand:#E0BB8A;--rose:#E1A3A3;--lav:#B6A9DD;
  --blue-s:rgba(134,163,207,.14);--sage-s:rgba(141,194,166,.14);--sand-s:rgba(224,187,138,.14);--rose-s:rgba(225,163,163,.14);--lav-s:rgba(182,169,221,.15);
  --glass:rgba(22,24,29,.72);--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* barra superior */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(var(--st) + 8px) calc(16px + var(--sr)) 8px calc(16px + var(--sl));display:flex;align-items:center;justify-content:space-between;background:transparent;transition:background .25s,border-color .25s;border-bottom:.5px solid transparent}
.topbar.scrolled{background:var(--glass);border-bottom-color:var(--sep)}
.topbar .small{font-weight:600;font-size:17px;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.topbar.scrolled .small{opacity:1;transform:none}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--blue);background:var(--card);box-shadow:var(--shadow)}
main{padding:calc(var(--st) + 56px) calc(16px + var(--sr)) calc(var(--sb) + 110px) calc(16px + var(--sl));max-width:720px;margin:0 auto}
h1.big{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px}
.sub{color:var(--text2);font-size:15px;margin:0 0 18px}
h2.sec{font-size:20px;font-weight:650;letter-spacing:-.01em;margin:26px 2px 10px;display:flex;align-items:center;justify-content:space-between}
h2.sec .link{font-size:15px;font-weight:500}
.link{color:var(--blue);font-weight:500}
.link.strong{font-weight:650}

/* tarjetas */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;border:.5px solid var(--sep)}
.card.tint-blue{background:linear-gradient(160deg,var(--blue-s),transparent 70%),var(--card)}
.card.tint-sage{background:linear-gradient(160deg,var(--sage-s),transparent 70%),var(--card)}
.card.tint-lav{background:linear-gradient(160deg,var(--lav-s),transparent 70%),var(--card)}
.card.tint-sand{background:linear-gradient(160deg,var(--sand-s),transparent 70%),var(--card)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{margin:0}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--text2)}
.small{font-size:13px}
.tiny{font-size:12px}
.b{font-weight:650}
.big-num{font-size:28px;font-weight:700;letter-spacing:-.02em}
.empty{color:var(--text2);text-align:center;padding:22px 10px;font-size:15px}

/* listas */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:.5px solid var(--sep);overflow:hidden;margin-bottom:12px}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;min-height:52px;position:relative;background:var(--card)}
.item+.item::before{content:"";position:absolute;top:0;left:52px;right:0;border-top:.5px solid var(--sep)}
.item .grow{flex:1;min-width:0}
.item .t{font-size:16px;overflow-wrap:anywhere}
.item .m{font-size:13px;color:var(--text2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item.done .t{text-decoration:line-through;color:var(--text2)}
.chk{width:26px;height:26px;border-radius:50%;border:1.8px solid color-mix(in srgb,var(--text2) 55%,transparent);display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s}
.chk svg{width:15px;height:15px;stroke:#fff;stroke-width:2.6;opacity:0}
.done .chk,.chk.on{background:var(--sage);border-color:var(--sage)}
.done .chk svg,.chk.on svg{opacity:1}
.mini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--text2)}
.mini svg{width:18px;height:18px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* chips y segmentado */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:999px;background:var(--card);border:.5px solid var(--sep);font-size:14px;white-space:nowrap;color:var(--text)}
.chip.on{background:var(--text);color:var(--bg)}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--text2)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:16px;position:relative}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:14px;font-weight:550;color:var(--text2);position:relative;z-index:1;transition:color .2s}
.seg button.on{color:var(--text);background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:999px;background:var(--blue);color:#fff;font-weight:600;font-size:16px;min-height:44px;transition:transform .15s}
.btn:active,.chip:active,.item:active,.iconbtn:active{transform:scale(.97)}
.btn.soft{background:var(--blue-s);color:var(--blue)}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.danger{background:var(--rose-s);color:var(--rose)}
.btn.sage{background:var(--sage);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;font-size:14px;min-height:36px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* barra de pestañas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:8px calc(8px + var(--sr)) calc(var(--sb) + 6px) calc(8px + var(--sl));background:var(--glass);border-top:.5px solid var(--sep)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:550;color:var(--text2);min-width:60px;padding:4px 0}
.tabbar button svg{width:25px;height:25px}
.tabbar button.on{color:var(--blue)}
.fab{position:fixed;right:calc(18px + var(--sr));bottom:calc(var(--sb) + 84px);z-index:25;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(95,130,180,.35)}
.fab svg{width:26px;height:26px;stroke-width:2.2}

/* anillo */
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:15px}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--sage);width:0}

/* hojas */
.ov{position:fixed;inset:0;z-index:50;background:rgba(20,20,25,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:720px;max-height:92vh;max-height:92dvh;background:var(--bg);border-radius:26px 26px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--sep);margin:8px auto 0;background:color-mix(in srgb,var(--text2) 35%,transparent)}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;gap:8px;touch-action:none}
.sh-head b{font-size:17px;text-align:center;flex:1}
.sh-head .link{min-width:64px;text-align:left}
.sh-head .link.strong{text-align:right}
.sh-body{overflow-y:auto;padding:6px 16px calc(var(--sb) + 24px);-webkit-overflow-scrolling:touch}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--text2);margin:0 4px 6px}
.inp{width:100%;background:var(--card);border:.5px solid var(--sep);border-radius:var(--r-sm);padding:12px 14px;font-size:16px;outline:none;min-height:46px;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-s)}
textarea.inp{min-height:90px;resize:vertical}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--text2) 50%),linear-gradient(135deg,var(--text2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:6px}
.days label{flex:1}
.days input{display:none}
.days span{display:grid;place-items:center;height:38px;border-radius:12px;background:var(--card);border:.5px solid var(--sep);font-size:14px;font-weight:600;color:var(--text2)}
.days input:checked+span{background:var(--blue);color:#fff;border-color:transparent}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--card2);transition:background .2s;border:.5px solid var(--sep)}
.switch span::after{content:"";position:absolute;width:27px;height:27px;border-radius:50%;background:#fff;top:1.5px;left:1.5px;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,1.4,.6,1)}
.switch input:checked+span{background:var(--sage)}
.switch input:checked+span::after{transform:translateX(20px)}
.note{font-size:13px;color:var(--text2);background:var(--card2);border-radius:14px;padding:10px 12px;margin:6px 0 12px}
.note.warn{background:var(--sand-s);color:var(--text)}

/* toast */
.toasts{position:fixed;top:calc(var(--st) + 10px);left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--text);color:var(--bg);padding:11px 16px;border-radius:16px;font-size:15px;max-width:440px;box-shadow:0 10px 30px rgba(0,0,0,.2);pointer-events:auto}

/* kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.kanban::-webkit-scrollbar{display:none}
.col{flex:0 0 78%;max-width:300px;scroll-snap-align:start;background:var(--card2);border-radius:var(--r);padding:12px}
.col h3{margin:2px 4px 10px;font-size:15px;display:flex;justify-content:space-between}
.kcard{background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;border:.5px solid var(--sep)}

/* chat */
.agents{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 6px;scrollbar-width:none}
.agents::-webkit-scrollbar{display:none}
.agent{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:999px;background:var(--card);border:.5px solid var(--sep);font-size:14px;font-weight:550}
.agent i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:15px}
.agent.on{background:var(--text);color:var(--bg)}
.msgs{display:flex;flex-direction:column;gap:10px;padding-bottom:80px}
.msg{max-width:88%;padding:11px 14px;border-radius:20px;font-size:16px;line-height:1.45;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--card);border:.5px solid var(--sep);border-bottom-left-radius:6px}
.msg.ai p{margin:0 0 8px}.msg.ai p:last-child{margin:0}
.msg.ai ul,.msg.ai ol{margin:4px 0 8px;padding-left:20px}
.msg.ai pre{white-space:pre-wrap;background:var(--card2);padding:8px;border-radius:10px;font-size:13px}
.msg.err{background:var(--rose-s);color:var(--text);border:0}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--text2);opacity:.4}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 64px);z-index:24;padding:8px calc(12px + var(--sr)) 8px calc(12px + var(--sl));display:flex;gap:8px;align-items:flex-end;max-width:720px;margin:0 auto;background:linear-gradient(transparent,var(--bg) 30%)}
.composer textarea{flex:1;min-height:44px;max-height:120px;resize:none;border-radius:22px;padding:11px 16px}
.send{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.4}
.act{border:1px dashed color-mix(in srgb,var(--blue) 50%,transparent);border-radius:16px;padding:10px 12px;margin-top:8px;background:var(--blue-s)}
.act .btns{margin-top:8px}

/* rutina en ejecución */
.run{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--st) + 20px) 24px calc(var(--sb) + 24px);text-align:center}
.run .stepname{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:22px 0 6px}
.run .timer{font-size:56px;font-weight:300;font-variant-numeric:tabular-nums;margin:10px 0 24px}
.run .close{position:absolute;top:calc(var(--st) + 12px);right:16px}

/* onboarding */
.onb{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;padding:calc(var(--st) + 40px) 24px calc(var(--sb) + 24px);overflow-y:auto}
.onb .logo{width:84px;height:84px;border-radius:22px;background:linear-gradient(135deg,var(--blue),var(--lav));display:grid;place-items:center;color:#fff;font-size:44px;font-weight:800;box-shadow:0 12px 30px rgba(95,130,180,.3);margin-bottom:24px}
.onb h1{font-size:34px;margin:0 0 8px;letter-spacing:-.02em}
.feat{display:flex;gap:14px;align-items:flex-start;margin:14px 0}
.feat i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font-style:normal;font-size:20px}
.pdots{display:flex;gap:6px;justify-content:center;margin:18px 0 12px}
.pdots i{width:7px;height:7px;border-radius:50%;background:var(--sep);background:color-mix(in srgb,var(--text2) 30%,transparent)}
.pdots i.on{background:var(--text);width:20px;border-radius:9px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--sand-s);border-radius:18px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.steps{counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:10px;margin:8px 0;font-size:15px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--blue-s);color:var(--blue);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
html.rm *{transition:none!important}
/* ===================== v2: carácter visual ===================== */
:root{--spring:cubic-bezier(.34,1.56,.64,1);--glass-b:rgba(253,252,250,.88);--hl:rgba(255,255,255,.75);--grad:linear-gradient(135deg,#6C8EBF 0%,#9585C2 100%)}
html[data-theme="dark"]{--glass-b:rgba(36,39,48,.86);--hl:rgba(255,255,255,.07);--grad:linear-gradient(135deg,#5A7BB0 0%,#7664B0 100%)}
html,body{overflow-x:hidden}
main{position:relative;z-index:1;padding-bottom:calc(var(--sb) + 130px)}
.xfab{position:fixed;right:calc(23px + var(--sr));bottom:calc(var(--sb) + 164px);z-index:25;width:46px;height:46px;border-radius:50%;background:var(--card);border:.5px solid var(--sep);font-size:21px;display:grid;place-items:center;box-shadow:0 10px 24px -10px rgba(43,45,51,.4)}
.xfab[hidden]{display:none}
.xfab:active{transform:scale(.92)}
.qp{position:fixed;inset:0;z-index:70;background:rgba(20,22,28,.32);display:flex;align-items:flex-end;justify-content:center;padding:16px calc(14px + var(--sr)) calc(var(--sb) + 14px) calc(14px + var(--sl))}
.qp-card{position:relative;width:100%;max-width:520px;background:var(--card);border:.5px solid var(--sep);border-radius:30px;padding:20px 18px 14px;box-shadow:0 30px 60px -20px rgba(20,22,28,.45)}
.qp-x{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:50%;color:var(--text2);font-size:16px}
.qp-title{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.qp-say{font-size:19px;font-weight:600;line-height:1.3;min-height:26px;padding-right:30px}
.qp-ans{margin-top:12px;padding:13px 15px;border-radius:20px;background:var(--card2);font-size:16px;line-height:1.45}
.qp-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.qp-row{display:flex;gap:10px;align-items:center;margin-top:14px}
.qp-row input{flex:1;min-width:0;height:48px;border-radius:24px;border:.5px solid var(--sep);background:var(--card2);padding:0 16px;font-size:16px;color:var(--text)}
.qp-mic{width:56px;height:56px;border-radius:50%;background:var(--grad);font-size:24px;color:#fff;flex:none}
.qp-mic.on{animation:qpp 1.1s ease-in-out infinite}
@keyframes qpp{0%,100%{box-shadow:0 0 0 0 rgba(108,142,191,.55)}50%{box-shadow:0 0 0 14px rgba(108,142,191,0)}}
.qp-tip{margin-top:10px;font-size:12.5px;color:var(--text2);text-align:center}
.cal{padding:14px 12px}
.cal-nav{width:40px;height:40px;border-radius:50%;font-size:26px;line-height:1;color:var(--blue)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-h{margin:8px 0 2px}.cal-h span{text-align:center;font-size:11.5px;font-weight:650;color:var(--text2)}
.cal-d{position:relative;height:46px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;font-size:15px;font-weight:550;color:var(--text)}
.cal-d.out{opacity:.35}
.cal-d.today span{color:var(--blue);font-weight:800}
.cal-d.sel{background:var(--blue);color:#fff}.cal-d.sel span{color:#fff}
.cal-d i{display:flex;gap:3px;margin-top:4px;height:6px}.cal-d i b{width:6px;height:6px;border-radius:50%}
.cal-d.sel i b{background:#fff!important;opacity:.85}
.cal-d em{position:absolute;top:2px;right:4px;font-style:normal;font-size:10px;font-weight:800;color:#C0605A}
.cal-t{width:48px;flex:none;font-size:13px;font-weight:650;color:var(--text2);font-variant-numeric:tabular-nums}
.seg button{font-size:13px}
.su{padding:14px 14px}
.su-ok{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--sep);display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff;margin-top:1px}
.su .steps li{display:block;position:relative;padding-left:32px;font-size:14px;line-height:1.4}
.su .steps li::before{position:absolute;left:0;top:0}
.su-ok.on{background:var(--sage);border-color:var(--sage)}
.su .btn[disabled]{opacity:.45}
.aurora{position:fixed;left:-25%;right:-25%;top:-15%;height:95vh;z-index:0;pointer-events:none;overflow:hidden;contain:strict}
.aurora i{position:absolute;border-radius:50%;opacity:.6}
.aurora i:nth-child(1){width:72vmax;height:72vmax;left:-6%;top:-18%;background:radial-gradient(circle,#A8BFE4 0%,transparent 66%);animation:none}
.aurora i:nth-child(2){width:62vmax;height:62vmax;right:-6%;top:2%;background:radial-gradient(circle,#CFC1F2 0%,transparent 66%);animation:none}
.aurora i:nth-child(3){width:58vmax;height:58vmax;left:22%;top:26%;background:radial-gradient(circle,#BDE3D0 0%,transparent 66%);animation:none}
html[data-theme="dark"] .aurora i{opacity:.3}
html[data-theme="dark"] .aurora i:nth-child(1){background:radial-gradient(circle,#3F5E96 0%,transparent 66%)}
html[data-theme="dark"] .aurora i:nth-child(2){background:radial-gradient(circle,#5B4B94 0%,transparent 66%)}
html[data-theme="dark"] .aurora i:nth-child(3){background:radial-gradient(circle,#2F6B5A 0%,transparent 66%)}
@keyframes drift1{to{transform:translate(14vw,12vh) scale(1.18)}}
@keyframes drift2{to{transform:translate(-16vw,14vh) scale(.92)}}
@keyframes drift3{to{transform:translate(-10vw,-8vh) scale(1.2)}}

/* cristal */
.card,.list{background:var(--glass-b);border:.5px solid var(--sep);border-radius:28px;box-shadow:inset 0 1px 0 var(--hl),0 1px 2px rgba(43,45,51,.04),0 16px 36px -14px rgba(43,45,51,.16)}
.card.tint-blue{background:linear-gradient(160deg,var(--blue-s),transparent 75%),var(--glass-b)}
.card.tint-sage{background:linear-gradient(160deg,var(--sage-s),transparent 75%),var(--glass-b)}
.card.tint-lav{background:linear-gradient(160deg,var(--lav-s),transparent 75%),var(--glass-b)}
.card.tint-sand{background:linear-gradient(160deg,var(--sand-s),transparent 75%),var(--glass-b)}
.item{background:transparent;min-height:58px}
.item+.item::before,.list>.srow+.srow .item::before{left:58px}
.list>.srow+.srow .item::before{content:"";position:absolute;top:0;right:0;border-top:.5px solid var(--sep)}

/* titulares */
h1.big{font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1.04;margin:6px 0 4px}
h1.big .w{display:inline-block;will-change:transform,opacity,filter}
.sub{font-size:16px;margin-bottom:20px}
h2.sec{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:30px 4px 12px}

/* héroe */
.hero{position:relative;overflow:hidden;border-radius:36px;padding:22px;color:#fff;background:var(--grad);box-shadow:0 26px 48px -18px rgba(108,142,191,.65),inset 0 1px 0 rgba(255,255,255,.4);margin-bottom:16px}
.hero::before{content:"";position:absolute;inset:-40% -20%;background:radial-gradient(circle at 18% 8%,rgba(255,255,255,.38),transparent 46%),radial-gradient(circle at 92% 92%,rgba(255,255,255,.2),transparent 42%);pointer-events:none}
.hero::after{content:"";position:absolute;top:-10%;bottom:-10%;width:45%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.32),transparent);transform:skewX(-18deg);animation:sheen 7s ease-in-out 2;pointer-events:none}
@keyframes sheen{0%,55%{left:-70%}100%{left:130%}}
.hero .muted{color:rgba(255,255,255,.86)}
.hero .btn.soft{background:rgba(255,255,255,.24);color:#fff;}
.hero .ring .lbl{color:#fff;font-size:24px;font-weight:800;letter-spacing:-.02em}
.hero.sage{background:linear-gradient(135deg,#6FA88A 0%,#5F82B4 100%);box-shadow:0 26px 48px -18px rgba(95,150,140,.6),inset 0 1px 0 rgba(255,255,255,.4)}
.hero .big-num{font-size:38px;font-weight:800;letter-spacing:-.03em}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);padding:5px 11px;border-radius:99px;font-size:13px;font-weight:650;margin-top:10px;}

/* barra flotante */
.tabbar{left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 24px);max-width:500px;bottom:calc(var(--sb) + 10px);border-radius:36px;padding:6px;border:.5px solid var(--sep);justify-content:space-between;box-shadow:inset 0 1px 0 var(--hl),0 22px 44px -14px rgba(43,45,51,.34)}
.tabbar .ind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:30px;background:var(--blue-s);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--blue) 35%,transparent),0 6px 16px -6px color-mix(in srgb,var(--blue) 50%,transparent);pointer-events:none}
.tabbar button{position:relative;z-index:1;flex:1;min-width:0;padding:8px 0 7px;transition:color .3s}
.tabbar button svg{transition:transform .5s var(--spring)}
.tabbar button.on svg{transform:translateY(-1px) scale(1.1)}
.fab{background:var(--grad);bottom:calc(var(--sb) + 94px);box-shadow:0 16px 30px -8px rgba(108,142,191,.65),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .4s var(--spring)}
.fab:active{transform:scale(.88) rotate(90deg)}

/* control segmentado con indicador */
.seg{background:color-mix(in srgb,var(--text) 6%,transparent);border-radius:18px;padding:4px}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:14px;background:var(--card);box-shadow:0 3px 10px rgba(43,45,51,.14),inset 0 1px 0 var(--hl);pointer-events:none}
.seg button{border-radius:14px;position:relative;z-index:1;transition:color .25s;padding:9px 4px}
.seg button.on{background:transparent;box-shadow:none;color:var(--text)}

/* check animado */
.chk{width:28px;height:28px;border-width:2px;transition:background .3s,border-color .3s,transform .45s var(--spring)}
.chk:active{transform:scale(.82)}
.chk svg{stroke-dasharray:26;stroke-dashoffset:26;opacity:1;transition:stroke-dashoffset .4s ease .08s}
.done .chk svg,.chk.on svg{stroke-dashoffset:0}
.done .chk,.chk.on{background:linear-gradient(135deg,var(--sage),color-mix(in srgb,var(--sage) 60%,var(--blue)))}

/* deslizar filas */
.srow{position:relative;overflow:hidden}
.srow .sbg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-weight:700;font-size:14px;color:#fff;opacity:0}
.srow .sbg span{opacity:0}
.srow .item{touch-action:pan-y;position:relative;z-index:1;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.srow.swiping .item{background:var(--card)}
.srow.swiping .sbg{opacity:1}

/* tarjetas Debo / Debería */
.kc{border-radius:28px;padding:16px 18px;text-align:left;background:var(--glass-b);border:.5px solid var(--sep);color:var(--text);box-shadow:inset 0 1px 0 var(--hl),0 14px 30px -16px rgba(43,45,51,.2);transition:transform .5s var(--spring),box-shadow .3s}
.kc .small,.kc .tiny{opacity:.7}
.kc .big-num{font-size:34px;font-weight:800}
.kc:active{transform:scale(.96)}
.kc.on{color:#fff;transform:translateY(-3px) scale(1.02)}
.kc.on.sand{background:linear-gradient(135deg,#DDAE70,#C97B7B);box-shadow:0 18px 32px -12px rgba(201,123,123,.6),inset 0 1px 0 rgba(255,255,255,.4)}
.kc.on.lav{background:linear-gradient(135deg,#9E8FCB,#6C8EBF);box-shadow:0 18px 32px -12px rgba(120,110,190,.6),inset 0 1px 0 rgba(255,255,255,.4)}

/* meta líquida */
.jar{width:78px;height:78px;flex:none;position:relative;filter:drop-shadow(0 8px 14px color-mix(in srgb,var(--blue) 25%,transparent))}
.jar svg{width:100%;height:100%;display:block}
.jar .lbl{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:-.02em;color:var(--text);text-shadow:0 0 8px var(--card),0 0 2px var(--card)}

/* progreso con brillo */
.bar{height:10px}
.bar>i{position:relative;overflow:hidden;background:linear-gradient(90deg,var(--sage),color-mix(in srgb,var(--sage) 55%,var(--blue)))}
.bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:shim 2.6s ease-in-out 2}
@keyframes shim{to{transform:translateX(100%)}}

/* ilustraciones y vacíos */
.card.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 20px}
.ill{width:124px;height:100px;animation:floaty 5.5s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-7px)}}
.flame{display:inline-block;transform-origin:50% 90%;animation:flame 1.5s ease-in-out infinite}
@keyframes flame{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.2) rotate(4deg)}}

/* hojas, mensajes, onboarding */
.ov{background:rgba(20,22,32,.3);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.sheet{background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(34px) saturate(170%);-webkit-backdrop-filter:blur(34px) saturate(170%);border-radius:34px 34px 0 0;border-top:.5px solid var(--hl)}
.btn{background:var(--grad);box-shadow:0 10px 22px -10px rgba(108,142,191,.7),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.soft{background:var(--blue-s);box-shadow:none;color:var(--blue)}
.btn.ghost{background:var(--card2);box-shadow:none;color:var(--text)}
.btn.danger{background:var(--rose-s);box-shadow:none;color:var(--rose)}
.btn.sage{background:linear-gradient(135deg,var(--sage),color-mix(in srgb,var(--sage) 60%,var(--blue)));box-shadow:0 10px 22px -10px rgba(111,168,138,.8)}
.msg.user{background:var(--grad);box-shadow:0 8px 18px -10px rgba(108,142,191,.7)}
.msg.ai{background:var(--glass-b);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.composer{bottom:calc(var(--sb) + 84px)}
.onb{background:color-mix(in srgb,var(--bg) 40%,transparent);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%)}
.onb .logo{position:relative;background:var(--grad);animation:logo 4s ease-in-out infinite}
.onb .logo::after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid color-mix(in srgb,var(--blue) 60%,transparent);animation:ping 2.6s ease-out infinite}
@keyframes logo{50%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.agent.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 10px 20px -10px rgba(108,142,191,.7)}
@media (prefers-reduced-motion:reduce){.aurora i,.hero::after,.ill,.flame,.bar>i::after,.onb .logo,.onb .logo::after{animation:none!important}}
html.rm .aurora i,html.rm .hero::after,html.rm .ill,html.rm .flame,html.rm .bar>i::after{animation:none!important}

.cap{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:650;background:var(--card2);color:var(--text2)}
.cap.full{background:var(--sand-s);color:var(--sand)}.cap.over{background:var(--rose-s);color:var(--rose)}
.daycard.over{background:linear-gradient(160deg,var(--sand-s),transparent 75%),var(--glass-b);outline:1.5px solid color-mix(in srgb,var(--sand) 45%,transparent)}
.daycard.today{outline:1.5px solid color-mix(in srgb,var(--blue) 45%,transparent)}
.daycap{height:6px;border-radius:9px;background:var(--card2);overflow:hidden;margin:10px 0 4px;display:flex;gap:2px}
.daycap i{flex:1;background:var(--card2)}.daycap i.d{background:var(--sand)}.daycap i.s{background:var(--lav)}.daycap i.x{background:var(--rose)}
.send.mic{background:var(--card2);color:var(--text);box-shadow:none}
.send.mic.on{background:var(--rose);color:#fff;animation:micp 1.1s ease-in-out infinite}
@keyframes micp{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--rose) 25%,transparent)}}
.ctx{min-height:340px!important;font-size:15px;line-height:1.45}
</style>

<script>
"use strict";
/* =========================================================
   Xevapp — PWA personal: vida, rutinas, ahorro, negocio, IA
   Todo vive en este dispositivo. Sin servidores de pago.
   ========================================================= */

/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dstr=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dstr();
const monthKey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const parseD=s=>{if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const DOW=["Do","Lu","Ma","Mi","Ju","Vi","Sá"];
const MONTHS=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fmtDate=s=>{const d=parseD(s);if(!d)return"";const t=parseD(today());const diff=Math.round((d-t)/864e5);if(diff===0)return"Hoy";if(diff===1)return"Mañana";if(diff===-1)return"Ayer";return`${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`};
const fmtDT=iso=>{if(!iso)return"";const d=new Date(iso);return`${fmtDate(dstr(d))}, ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const num=v=>{const n=Number(String(v??"").replace(/[^\d.,-]/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",","."));return isFinite(n)?n:0};
const money=n=>{try{return new Intl.NumberFormat("es-CO",{style:"currency",currency:S.settings.currency||"COP",maximumFractionDigits:0}).format(n||0)}catch{return"$"+Math.round(n||0).toLocaleString("es-CO")}};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const reduced=()=>S.settings.reduceMotion||matchMedia("(prefers-reduced-motion: reduce)").matches;
const G=()=>window.gsap&&!reduced()?window.gsap:null;
const icon=(id,cls="i")=>`<svg class="${cls}"><use href="#i-${id}"/></svg>`;

/* ---------- almacenamiento ---------- */
const KEY="xevapp_v1",KEYS="xevapp_keys";
let storageOK=true;
const mem={};
const ls={get(k){try{return localStorage.getItem(k)}catch{storageOK=false;return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch{storageOK=false;mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch{delete mem[k]}}};

const AREAS=["Personal","Negocio","Dinero","Contenido","Salud"];
const AREA_COLOR={Personal:"var(--blue)",Negocio:"var(--sand)",Dinero:"var(--sage)",Contenido:"var(--lav)",Salud:"var(--rose)"};
const GASTOS=["Comida","Transporte","Hogar","Servicios","Salud","Ocio","Negocio","Educación","Deudas","Otros"];
const INGRESOS=["Salario","Ventas","Freelance","Regalo","Otros"];
const FORMATS=["Reel","Post","Carrusel","Historia","Video largo","Artículo"];
const STAGES=[["idea","Idea"],["guion","Guion"],["produccion","Producción"],["publicado","Publicado"]];
const IDEA_ST=[["sugerida","Sugerida"],["idea","Guardada"],["validando","Validando"],["marcha","En marcha"],["descartada","Descartada"]];

function def(){return{
  v:1,onboarded:false,lastBackup:null,
  profile:{name:"",city:"",skills:"",interests:"",hours:"",capital:"",context:""},lastReview:"",
  tasks:[],routines:[],challenges:[],checklists:[],goals:[],money:[],budgets:{},ideas:[],people:[],decisions:[],content:[],reminders:[],
  chats:{},fired:{},notifCount:{},pays:[],research:[],pushId:"",pushInfo:"",
  settings:{pushUrl:"",digest:"07:00",maxDebo:3,maxDeb:2,voice:false,theme:"auto",currency:"COP",provider:"openrouter",models:{openrouter:"openrouter/free",gemini:"gemini-2.5-flash",groq:"llama-3.3-70b-versatile"},shareContext:true,shareFinance:false,reduceMotion:false,notif:false,quietFrom:"22:00",quietTo:"07:00",maxNotif:12},
  ui:{tab:"hoy",planear:"tareas",kind:"debo",area:"Todas",dinero:"metas",negocio:"ideas",agent:"planner"}
}}
let S=def();
function load(){
  const raw=ls.get(KEY);
  if(raw){try{const p=JSON.parse(raw);const d=def();S={...d,...p,settings:{...d.settings,...(p.settings||{}),models:{...d.settings.models,...((p.settings||{}).models||{})}},ui:{...d.ui,...(p.ui||{})},profile:{...d.profile,...(p.profile||{})}}}catch(e){console.warn("Datos dañados",e)}}
}

const PRIO={alta:0,media:1,baja:2};
function sortTasks(a,b){if(a.done!==b.done)return a.done?1:-1;const ad=a.due||"9999",bd=b.due||"9999";if(ad!==bd)return ad<bd?-1:1;return(PRIO[a.priority]??1)-(PRIO[b.priority]??1)}

function routineDoneOn(r,ds){const l=(r.log||{})[ds]||[];return r.steps.length>0&&r.steps.every(s=>l.includes(s.id))}
function streak(r){
  const d=new Date();let n=0;
  if(!routineDoneOn(r,dstr(d)))d.setDate(d.getDate()-1);
  for(let i=0;i<400;i++){if(r.days.includes(d.getDay())){if(routineDoneOn(r,dstr(d)))n++;else break}d.setDate(d.getDate()-1)}
  return n;
}
const routinesToday=()=>S.routines.filter(r=>r.days.includes(new Date().getDay()));

function goalStats(g){
  const saved=(g.contribs||[]).reduce((a,c)=>a+Number(c.amount||0),0);
  const target=Number(g.target)||0,rem=Math.max(0,target-saved),pct=target?clamp(saved/target,0,1):0;
  let perMonth=null,perWeek=null,perQ=null,daysLeft=null;
  if(g.deadline){daysLeft=Math.ceil((parseD(g.deadline)-parseD(today()))/864e5);if(daysLeft>0&&rem>0){perWeek=rem/Math.max(1,daysLeft/7);perMonth=rem/Math.max(1,daysLeft/30.44);perQ=perMonth/2}}
  const since=Date.now()-90*864e5;
  const recent=(g.contribs||[]).filter(c=>parseD(c.date)>=since).reduce((a,c)=>a+Number(c.amount||0),0);
  const firstC=(g.contribs||[]).map(c=>parseD(c.date)).sort((a,b)=>a-b)[0];
  const months=firstC?clamp((Date.now()-firstC)/(30.44*864e5),1,3):3;
  const monthly=recent/months;
  let proj=null;if(rem>0&&monthly>0){const d=new Date();d.setDate(d.getDate()+Math.round(rem/monthly*30.44));proj=dstr(d)}
  let pace=null;if(proj&&g.deadline)pace=proj<=g.deadline?"adelante":"atrasado";
  return{saved,target,rem,pct,perMonth,perWeek,perQ,daysLeft,monthly,proj,pace};
}
function monthMoney(mk=monthKey()){
  const items=S.money.filter(m=>m.date.startsWith(mk));
  const inc=items.filter(m=>m.type==="ingreso").reduce((a,m)=>a+Number(m.amount),0);
  const exp=items.filter(m=>m.type==="gasto").reduce((a,m)=>a+Number(m.amount),0);
  const byCat={};items.filter(m=>m.type==="gasto").forEach(m=>byCat[m.category]=(byCat[m.category]||0)+Number(m.amount));
  return{items,inc,exp,bal:inc-exp,byCat};
}

/* deslizar filas: → completa · ← mueve entre Debo y Debería */
(function swipe(){
  const v=document.getElementById("view");let st=null;
  v.addEventListener("pointerdown",e=>{
    const row=e.target.closest(".srow");if(!row||e.target.closest("button"))return;
    st={row,item:row.querySelector(".item"),bg:row.querySelector(".sbg"),x:e.clientX,y:e.clientY,dx:0,on:false};
  });
  v.addEventListener("pointermove",e=>{
    if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;
    if(!st.on){
      if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.5){st.on=true;st.row.classList.add("swiping");try{st.item.setPointerCapture(e.pointerId)}catch{}}
      else{if(Math.abs(dy)>12)st=null;return}
    }
    const a=Math.abs(dx),eff=Math.sign(dx)*(a<130?a:130+(a-130)*.25),p=clamp(a/90,0,1);
    st.dx=dx;st.item.style.transform=`translateX(${eff}px)`;
    st.bg.style.background=dx>0?"linear-gradient(90deg,var(--sage),color-mix(in srgb,var(--sage) 60%,var(--blue)))":"linear-gradient(270deg,var(--lav),var(--blue))";
    st.bg.style.opacity=String(.3+.7*p);
    st.bg.querySelector(".l").style.opacity=dx>0?p:0;st.bg.querySelector(".r").style.opacity=dx<0?p:0;
  });
  const finish=()=>{
    if(!st)return;const s=st;st=null;if(!s.on)return;swipeSuppress=Date.now();
    const id=s.row.dataset.sid,g=G(),act=Math.abs(s.dx)>90?(s.dx>0?"done":"swap"):null;
    if(act){
      const go=()=>{act==="done"?A.toggleTask({id},s.row.querySelector(".chk")):A.swapTask({id})};
      if(g)g.to(s.item,{x:(s.dx>0?1:-1)*window.innerWidth,opacity:0,duration:.3,ease:"power2.in",onComplete:go});else go();
    }else{
      const done=()=>{s.item.style.transform="";s.row.classList.remove("swiping");s.bg.style.opacity="0"};
      if(g)g.to(s.item,{x:0,duration:.6,ease:"elastic.out(1,.55)",onComplete:()=>{g.set(s.item,{clearProps:"transform"});done()}});else done();
    }
  };
  v.addEventListener("pointerup",finish);v.addEventListener("pointercancel",finish);
  document.addEventListener("click",e=>{if(Date.now()-swipeSuppress<350){e.stopPropagation();e.preventDefault()}},true);
})();

  ${limitPill()}${(()=>{const best=Math.max(0,...S.routines.map(streak),...(S.challenges||[]).map(chStreak));return best?`<div class="pill"><span class="flame">🔥</span> ${best} día${best>1?"s":""} de racha</div>`:""})()}
  <div class="btns" style="margin-top:12px"><button class="btn sm soft" data-act="planDay">${icon("spark")}Planear mi día con IA</button></div></div></div></div>

  ${(()=>{const wk=dstr((()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return d})());const dw=new Date().getDay();return(dw===0||dw===1)&&S.lastReview!==wk?`<div class="card tint-lav"><div class="b">🗓️ Ritual semanal · 15 min</div><div class="muted small" style="margin:4px 0 10px">Lo fijo primero, máximo ${LIM().d} DEBO y ${LIM().s} DEBERÍA por día, y lo que no cabe a la próxima semana.</div><div class="btns"><button class="btn sm" data-act="ritual" data-wk="${wk}">Planear mi semana</button><button class="btn sm ghost" data-act="ritualSkip" data-wk="${wk}">Hoy no</button></div></div>`:""})()}
  ${setupCard()}

  ${chT.length?`<h2 class="sec">Retos de hoy</h2>${chT.map(c=>chRow(c)).join("")}`:""}

  ${focus.length?listOf(focus.map(taskRow),""):`<div class="card empty">${ill()}Elige hasta 3 prioridades. Lo demás puede esperar.</div>`}

  ${nowR?`<h2 class="sec">Rutina · ${esc(nowR.name)} <button class="link" data-act="runRoutine" data-id="${nowR.id}">Empezar</button></h2>

function viewSemana(){
  const L=LIM(),t=today();
  const overdue=S.tasks.filter(x=>!x.done&&x.due&&x.due<t),nodate=S.tasks.filter(x=>!x.done&&!x.due);

    const d=parseD(ds),l=dayLoad(ds),over=l.d>L.d||l.s>L.s,rts=S.routines.filter(r=>r.days.includes(d.getDay()));
    const done=S.tasks.filter(x=>x.done&&x.due===ds).length;
    const segs=[...Array(L.d)].map((_,i)=>`<i class="${i<l.d?"d":""}"></i>`).join("")+[...Array(L.s)].map((_,i)=>`<i class="${i<l.s?"s":""}"></i>`).join("")+(l.d>L.d||l.s>L.s?[...Array(Math.max(0,l.d-L.d)+Math.max(0,l.s-L.s))].map(()=>'<i class="x"></i>').join(""):"");

    return`<div class="card daycard ${over?"over":""} ${ds===t?"today":""}"><div class="between"><div><div class="b" style="font-size:17px;text-transform:capitalize">${ds===t?"Hoy":ds===addDays(t,1)?"Mañana":DN[d.getDay()]} <span class="muted small" style="font-weight:500">${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}</span></div></div><div class="row" style="gap:6px"><span class="cap ${l.d>L.d?"over":l.d===L.d?"full":""}">${l.d}/${L.d} Debo</span><span class="cap ${l.s>L.s?"over":l.s===L.s?"full":""}">${l.s}/${L.s} Deb.</span></div></div>
    <div class="daycap">${segs}</div>
    ${rts.length?`<div class="muted tiny" style="margin-bottom:6px">Rutinas: ${rts.map(r=>esc(r.name)+(r.time?" "+r.time:"")).join(" · ")}</div>`:""}
    ${rows.length?`<div class="list" style="margin:6px -4px 8px;box-shadow:none">${rows.join("")}</div>`:`<div class="muted small" style="margin:6px 0 8px">Día libre ${done?`· ${done} hecho${done>1?"s":""}`:""}</div>`}
    ${(()=>{const s0=atOn(ds,"00:00"),s1=s0+864e5;const ev=S.reminders.filter(r=>!r.done).flatMap(r=>nextOcc(r,s0).filter(a=>a>=s0&&a<s1).map(a=>({r,a})));const py=S.pays.map(p=>({p,n:payNext(p)})).filter(x=>x.n&&x.n.ds===ds);return ev.length||py.length?`<div style="margin:0 0 8px">${ev.map(({r,a})=>{const d=new Date(a);return`<button class="chip" style="margin:0 6px 6px 0" data-act="editRem" data-id="${r.id}">${r.kind==="evento"?"📅":"🔔"} ${pad(d.getHours())}:${pad(d.getMinutes())} ${esc(r.title)}</button>`}).join("")}${py.map(({p})=>`<button class="chip" style="margin:0 6px 6px 0;background:var(--sand-s)" data-act="editPay" data-id="${p.id}">💳 ${esc(p.name)}</button>`).join("")}</div>`:""})()}
    <div class="btns"><button class="btn sm ghost" data-act="newTaskOn" data-d="${ds}">${icon("plus")}Tarea</button><button class="btn sm ghost" data-act="newRemOn" data-d="${ds}">${icon("bell")}Aviso</button>${over?`<button class="btn sm" data-act="moveExcess" data-d="${ds}">Mover excedente</button>`:""}</div></div>`;
  }).join("");
  return`<div class="card tint-blue"><div class="b">Tu semana</div><div class="muted small" style="margin:4px 0 10px">Máximo ${L.d} DEBO + ${L.s} DEBERÍA por día. Lo que no cabe pasa al siguiente día libre.</div>
  <div class="btns">${nodate.length?`<button class="btn sm" data-act="distribute" data-v="nodate">Repartir ${nodate.length} sin fecha</button>`:""}<button class="btn sm soft" data-act="aiWeek">${icon("spark")}Planear con IA</button><button class="btn sm ghost" data-act="context">Límites</button></div></div>
  ${overdue.length?`<div class="card tint-sand"><div class="between"><div><div class="b">${overdue.length} atrasada${overdue.length>1?"s":""}</div><div class="muted small">${overdue.slice(0,3).map(x=>esc(x.title)).join(" · ")}</div></div><button class="btn sm" data-act="distribute" data-v="overdue">Reprogramar</button></div></div>`:""}
  ${days}`;
}
function viewRutinas(){

let sheetN=0;
function openSheet({title,html,submit,onMount,saveLabel="Guardar"}){
  const n=++sheetN;
  const ov=document.createElement("div");ov.className="ov";
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="sh-head"><button type="button" class="link" data-close>${submit?"Cancelar":"Cerrar"}</button><b>${esc(title)}</b>${submit?`<button type="submit" form="shf${n}" class="link strong">${saveLabel}</button>`:'<span style="min-width:64px"></span>'}</div><form id="shf${n}" class="sh-body" novalidate>${html}</form></div>`;
  document.body.appendChild(ov);document.body.style.overflow="hidden";
  const sh=$(".sheet",ov),form=$("form",ov);
  const close=()=>{const g=G();const done=()=>{ov.remove();if(!$(".ov"))document.body.style.overflow=""};if(g){g.to(sh,{y:"100%",duration:.3,ease:"power2.in"});g.to(ov,{opacity:0,duration:.3,onComplete:done})}else done()};
  ov.addEventListener("click",e=>{if(e.target===ov||e.target.closest("[data-close]"))close()});
  form.addEventListener("submit",e=>{e.preventDefault();if(!submit)return;const fd=new FormData(form);const r=submit(Object.fromEntries(fd),fd,form);if(r!==false){close();save();render()}});
  // arrastrar para cerrar
  let y0=null,dy=0;const head=$(".sh-head",ov),grab=$(".grab",ov);
  [head,grab].forEach(h=>{h.addEventListener("touchstart",e=>{y0=e.touches[0].clientY;dy=0},{passive:true});h.addEventListener("touchmove",e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform=`translateY(${dy}px)`},{passive:true});h.addEventListener("touchend",()=>{if(dy>110)close();else{const g=G();g?g.to(sh,{y:0,duration:.3,ease:"back.out(1.5)",onComplete:()=>sh.style.transform=""}):sh.style.transform=""}y0=null})});
  const g=G();if(g){g.fromTo(ov,{opacity:0},{opacity:1,duration:.25});g.fromTo(sh,{y:"100%"},{y:0,duration:.6,ease:"back.out(.9)"});g.from(ov.querySelectorAll(".sh-body > *"),{y:24,opacity:0,duration:.55,stagger:.035,delay:.14,ease:"expo.out",clearProps:"transform,opacity"})}
  onMount&&onMount(form,close);
  return{close,form,ov};
}

/* ---------- rutina en ejecución ---------- */
function runRoutine(id){
  const r=S.routines.find(x=>x.id===id);if(!r||!r.steps.length)return toast("Agrega pasos a la rutina");
  const t=today();r.log=r.log||{};r.log[t]=r.log[t]||[];
  let i=r.steps.findIndex(s=>!r.log[t].includes(s.id));if(i<0)i=0;
  let left=0,timer=null,paused=false;
  const el=document.createElement("div");el.className="run";document.body.appendChild(el);document.body.style.overflow="hidden";
  const end=()=>{clearInterval(timer);el.remove();document.body.style.overflow="";save();render()};
  const show=()=>{
    const s=r.steps[i];left=(Number(s.min)||1)*60;paused=false;
    el.innerHTML=`<button class="iconbtn close" data-x aria-label="Salir">${icon("x")}</button><div class="muted small">${esc(r.name)} · paso ${i+1} de ${r.steps.length}</div>${ring((i)/r.steps.length,90,8,"var(--sage)",`${i}/${r.steps.length}`)}<div class="stepname">${esc(s.title)}</div><div class="timer" id="tm"></div><div class="btns" style="justify-content:center"><button class="btn ghost" data-p>Pausa</button><button class="btn sage" data-d>${icon("check")}Hecho</button></div><button class="link" style="margin-top:18px" data-s>Saltar</button>`;
    const tm=$("#tm",el);const tick=()=>{tm.textContent=`${pad(Math.floor(Math.max(0,left)/60))}:${pad(Math.max(0,left)%60)}`;if(left===0){notify("Xevapp · Rutina",`Tiempo de "${s.title}" terminado`,"run")}};tick();
    clearInterval(timer);timer=setInterval(()=>{if(!paused&&left>0){left--;tick()}},1000);
    $("[data-x]",el).onclick=end;
    $("[data-p]",el).onclick=e=>{paused=!paused;e.target.textContent=paused?"Seguir":"Pausa"};
    $("[data-d]",el).onclick=()=>{if(!r.log[t].includes(s.id))r.log[t].push(s.id);next()};
    $("[data-s]",el).onclick=next;
    const g=G();g&&g.fromTo(el.children,{y:20,opacity:0},{y:0,opacity:1,stagger:.05,duration:.45,ease:"power3.out"});
  };
  const next=()=>{i++;if(i>=r.steps.length){clearInterval(timer);const done=routineDoneOn(r,t);el.innerHTML=`<div style="font-size:64px">${done?"🎉":"👍"}</div><div class="stepname">${done?"¡Rutina completa!":"Rutina terminada"}</div><p class="muted">${done?`Racha: ${streak(r)} día(s)`:"Algunos pasos quedaron sin marcar."}</p><button class="btn" data-x>Listo</button>`;$("[data-x]",el).onclick=end;if(done)celebrate();save()}else show()};
  show();
}
function celebrate(){
  const g=G();if(!g)return;
  const c=document.createElement("div");c.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden";document.body.appendChild(c);
  const cols=["var(--sage)","var(--blue)","var(--lav)","var(--sand)","var(--rose)"];
  for(let k=0;k<46;k++){
    const d=document.createElement("i"),sq=k%3===0;
    d.style.cssText=`position:absolute;left:50%;top:42%;width:${sq?11:8}px;height:${sq?5:8}px;border-radius:${sq?"2px":"50%"};background:${cols[k%5]}`;c.appendChild(d);
    const a=-Math.PI/2+(Math.random()-.5)*2.4,r=150+Math.random()*230,tx=Math.cos(a)*r,ty=Math.sin(a)*r;
    g.timeline().to(d,{x:tx,y:ty,rotation:Math.random()*540,duration:.7,ease:"power2.out"}).to(d,{y:ty+260+Math.random()*180,opacity:0,duration:.95,ease:"power1.in"},">-.05");
  }
  setTimeout(()=>c.remove(),2200);
}

const LIM=()=>({d:Number(S.settings.maxDebo)||3,s:Number(S.settings.maxDeb)||2});
function dayLoad(ds,exceptId){const t=S.tasks.filter(x=>!x.done&&x.due===ds&&x.id!==exceptId);return{d:t.filter(x=>x.kind==="debo").length,s:t.filter(x=>x.kind==="deberia").length,list:t}}
function firstFree(kind,fromDs,exceptId){const d=parseD(fromDs);const L=LIM();for(let i=0;i<120;i++){const ds=dstr(d);const l=dayLoad(ds,exceptId);if(kind==="debo"?l.d<L.d:l.s<L.s)return ds;d.setDate(d.getDate()+1)}return fromDs}
function addDays(ds,n){const d=parseD(ds);d.setDate(d.getDate()+n);return dstr(d)}
function checkLimit(t){if(!t.due||t.done)return;const l=dayLoad(t.due),L=LIM();const over=t.kind==="debo"?l.d>L.d:l.s>L.s;if(over){const alt=firstFree(t.kind,addDays(t.due,1),t.id);toast(`Ese día ya superó tu máximo de ${t.kind==="debo"?L.d+" DEBO":L.s+" DEBERÍA"}. Próximo día libre: ${fmtDate(alt)}`,4500)}}

class AIError extends Error{constructor(msg,code){super(msg);this.code=code}}
function friendlyError(status,body,prov){
  if(status===401||status===403)return new AIError(`La clave de ${PROVIDERS[prov].name} no es válida o no tiene permiso. Revísala en Ajustes.`,"key");
  if(status===402)return new AIError("OpenRouter indica saldo negativo en tu cuenta. Los modelos gratuitos requieren no estar en negativo.","pay");
  if(status===429)return new AIError(prov==="openrouter"?"Llegaste al límite gratuito (20 por minuto o 50 por día). Espera un momento o prueba mañana; también puedes cambiar a Gemini o Groq en Ajustes.":"Se alcanzó el límite gratuito. Espera un momento o cambia de proveedor en Ajustes.","quota");
  if(status===404||status===400)return new AIError(`El modelo no está disponible o la solicitud no es válida. Prueba otro modelo en Ajustes.${body?" ("+String(body).slice(0,140)+")":""}`,"model");
  if(status>=500)return new AIError("El servicio de IA está saturado ahora mismo. Intenta en unos segundos.","server");
  return new AIError("Error inesperado de la IA: "+status,"other");
}
async function readSSE(res,onData){
  const reader=res.body.getReader();const dec=new TextDecoder();let buf="";
  for(;;){const{value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith("data:"))continue;const d=line.slice(5).trim();if(d==="[DONE]")return;try{onData(JSON.parse(d))}catch{}}}
}
async function callAI({system,messages,onToken,signal,json=false}){
  const prov=S.settings.provider,key=getKeys()[prov],model=(S.settings.models[prov]||"").trim();
  if(!key)throw new AIError("Conecta la IA en Ajustes para usar el asistente (es gratis).","nokey");
  if(PREVIEW)throw new AIError("Estás en la vista previa dentro de Claude: aquí las conexiones externas están bloqueadas. La IA funciona en tu versión publicada (GitHub Pages).","preview");
  let full="";const push=t=>{if(!t)return;full+=t;onToken&&onToken(full)};
  for(let attempt=0;attempt<3;attempt++){
    let res;
    try{
      if(prov==="gemini"){
        res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`,{method:"POST",signal,headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:messages.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]})),generationConfig:{temperature:.7,...(json?{responseMimeType:"application/json"}:{})}})});
      }else{
        const url=prov==="groq"?"https://api.groq.com/openai/v1/chat/completions":"https://openrouter.ai/api/v1/chat/completions";
        const headers={"Content-Type":"application/json",Authorization:`Bearer ${key}`};if(prov==="openrouter")headers["X-Title"]="Xevapp";
        res=await fetch(url,{method:"POST",signal,headers,body:JSON.stringify({model,stream:true,temperature:.7,messages:[{role:"system",content:system},...messages.map(m=>({role:m.role,content:m.content}))]})});
      }
    }catch(e){if(e.name==="AbortError")throw e;throw new AIError(navigator.onLine?"No se pudo conectar con la IA. Revisa tu conexión e intenta de nuevo.":"Sin conexión a internet. El resto de Xevapp sigue funcionando.","net")}
    if(res.ok){
      if(prov==="gemini")await readSSE(res,d=>push((d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("")));
      else await readSSE(res,d=>{if(d.error)throw new AIError("La IA devolvió un error: "+(d.error.message||""),"other");push(d.choices?.[0]?.delta?.content)});
      if(!full.trim())throw new AIError("La IA no devolvió texto. Intenta de nuevo o cambia de modelo.","empty");
      return full;
    }
    const body=await res.text().catch(()=>"");
    if((res.status===429&&attempt===0)||(res.status>=500&&attempt<2)){await new Promise(r=>setTimeout(r,attempt?4000:1500));continue}
    throw friendlyError(res.status,body,prov);
  }
}

/* ---------- markdown mínimo y acciones ---------- */
function md(src){
  const blocks=[];let s=esc(src).replace(/```[\w]*\n?([\s\S]*?)```/g,(_,c)=>{blocks.push(c);return`\u0000${blocks.length-1}\u0000`});
  const lines=s.split("\n");let out="",list=null;
  const inline=t=>t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|\W)\*(?!\s)(.+?)\*(?=\W|$)/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const closeL=()=>{if(list){out+=`</${list}>`;list=null}};
  for(const l of lines){
    let m;
    if((m=l.match(/^\s*[-*•]\s+(.*)/))){if(list!=="ul"){closeL();out+="<ul>";list="ul"}out+=`<li>${inline(m[1])}</li>`;continue}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=="ol"){closeL();out+="<ol>";list="ol"}out+=`<li>${inline(m[1])}</li>`;continue}
    closeL();
    if((m=l.match(/^#{1,4}\s+(.*)/))){out+=`<p><b>${inline(m[1])}</b></p>`;continue}
    if(l.trim()==="")continue;
    out+=`<p>${inline(l)}</p>`;
  }
  closeL();
  return out.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<pre>${blocks[i]}</pre>`);
}
function splitActions(text){
  const re=/```(?:json)?\s*(\{[\s\S]*?"actions"[\s\S]*?\})\s*```/i;
  const m=text.match(re);let actions=[];let clean=text;
  if(m){try{actions=(JSON.parse(m[1]).actions||[]).filter(a=>a&&a.type);clean=text.replace(m[0],"").trim()}catch{}}
  else{const i=text.indexOf("```json");if(i>=0)clean=text.slice(0,i).trim()}
  return{clean,actions};
}

    case"create_goal":return`${a.name||""} · ${money(num(a.target))}${a.deadline?" · "+fmtDate(a.deadline):""}`;
    case"create_checklist":return`${a.name||""} (${(a.items||[]).length} elementos)`;
    case"create_routine":return`${a.name||""} · ${(a.steps||[]).length} pasos${a.time?" · "+a.time:""}`;
    case"create_content":return`${a.format||"Contenido"}: ${a.title||""}`;
    case"create_idea":return a.title||"";
    case"create_research":return a.topic||"";
    case"schedule_task":return`${a.title||""} → ${a.due?fmtDate(a.due):""}`;
    case"create_reminder":return`${a.title||""} · ${a.at?fmtDT(a.at):""}`;
  }return a.title||a.name||"";
}

    case"schedule_task":{const q=String(a.title||"").toLowerCase().trim();const t=S.tasks.find(x=>!x.done&&x.title.toLowerCase()===q)||S.tasks.find(x=>!x.done&&q&&(x.title.toLowerCase().includes(q)||q.includes(x.title.toLowerCase())));if(!t||!/^\d{4}-\d{2}-\d{2}$/.test(a.due||""))return false;t.due=a.due;break}
    case"create_reminder":{const at=a.at&&!isNaN(new Date(a.at))?a.at.slice(0,16):"";if(!at)return false;S.reminders.push({id:uid(),title:String(a.title||"Recordatorio"),at,kind:a.kind==="evento"?"evento":"recordatorio",repeat:REP[a.repeat]?a.repeat:"none",notes:a.notes||""});break}
    default:return false;
  }
  return true;
}

const XV = (() => {

  const fold = (s) => String(s).replace(/[áàäÁ]/g, "a").replace(/[éèëÉ]/g, "e").replace(/[íìïÍ]/g, "i")

  const dowOf = (ds) => { const [y, m, d] = ds.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };
  const nextDow = (today, dow) => { let n = (dow - dowOf(today) + 7) % 7; if (n === 0) n = 7; return addD(today, n); };
  const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  const DIAS_T = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
  const dayName = (ds, today) => ds === today ? "hoy" : ds === addD(today, 1) ? "mañana"
    : `el ${DIAS_T[dowOf(ds)]} ${+ds.slice(8)} de ${MESES[+ds.slice(5, 7) - 1]}`;
  const say = (h, m) => {
    const h12 = h % 12 === 0 ? 12 : h % 12, per = h < 12 ? "de la mañana" : h < 19 ? "de la tarde" : "de la noche";
    return `${h12 === 1 && !m ? "la una" : "las " + h12}${m ? ":" + String(m).padStart(2, "0") : ""} ${per}`;
  };

  const ADD_RE = /^\s*(?:por favor[, ]*)?(?:xeva[, ]*)?(?:(recuerdame|recordarme|recuerda|anota|anotar|agrega|agregar|anade|anadir|apunta|apuntar|guarda|guardar|guardame|crea|crear|programa|programar|no olvides|tengo que|debo|deberia)\b)[:,]?\s*(?:que\s+|una?\s+(?:tarea|recordatorio)\s+(?:de\s+|para\s+)?)?/;
  const isAdd = (q) => ADD_RE.test(fold(q));

  function parseAdd(text, now, tz) {
    let raw = String(text || "").trim(), f = fold(raw);

    const cut = (re) => { const m = f.match(re); if (!m) return null; raw = raw.slice(0, m.index) + " " + raw.slice(m.index + m[0].length); f = fold(raw); return m; };

/* ---------- Calendario mensual ---------- */
const MES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
function calItems(fromDs,days){
  const map={},put=(ds,it)=>{(map[ds]=map[ds]||[]).push(it)},s0=atOn(fromDs,"00:00"),endDs=addDays(fromDs,days);
  const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes())};
  S.reminders.filter(r=>!r.done).forEach(r=>nextOcc(r,s0).forEach(a=>{const ds=dstr(new Date(a));if(ds>=fromDs&&ds<endDs)put(ds,{t:hm(a),ic:r.kind==="evento"?"📅":"🔔",title:r.title,c:"var(--blue)",act:"editRem",id:r.id})}));
  S.tasks.filter(x=>x.due&&x.due>=fromDs&&x.due<endDs).forEach(x=>put(x.due,{t:x.remindAt?x.remindAt.slice(11,16):"",ic:x.done?"✅":x.kind==="debo"?"📌":"💭",title:x.title,c:"var(--sand)",act:"editTask",id:x.id,done:x.done,kind:x.kind}));
  for(let i=0;i<days;i++){const ds=addDays(fromDs,i),dow=parseD(ds).getDay();
    S.routines.forEach(r=>{if(r.days.includes(dow))put(ds,{t:r.time||"",ic:"🌱",title:r.name,c:"var(--sage)",act:"editRoutine",id:r.id,done:routineDoneOn(r,ds)})});
    (S.challenges||[]).forEach(c=>{if(chOn(c,ds))put(ds,{t:c.time||"",ic:c.icon||"💪",title:c.type==="progressive"?`${c.name}: ${chTarget(c,ds)} ${c.unit||""}`:c.name,c:"var(--sage)",act:"editChal",id:c.id,done:chDone(c,ds)})});
  }
  S.pays.forEach(p=>{for(let k=-1;k<3;k++){const d=parseD(fromDs);d.setDate(1);d.setMonth(d.getMonth()+k);const mk=monthKey(d);if(p.since&&mk<p.since)continue;const ds=payDue(p,mk);if(ds&&ds>=fromDs&&ds<endDs)put(ds,{t:"",ic:(p.paid||[]).includes(mk)?"✅":"💳",title:p.name+(p.amount?" · "+money(num(p.amount)):""),c:"var(--rose, #C98C8C)",act:"editPay",id:p.id,done:(p.paid||[]).includes(mk)})}});
  (S.research||[]).forEach(r=>{if(r.reviewAt>=fromDs&&r.reviewAt<endDs)put(r.reviewAt,{t:"",ic:"🔎",title:"Revisar: "+r.topic,c:"var(--lav, #9585C2)",act:"goTab",id:"",v:"asistente"})});
  Object.values(map).forEach(L=>L.sort((a,b)=>(a.t||"99")<(b.t||"99")?-1:1));
  return map;
}
function viewCalendario(){
  const t=today();const mk=S.ui.calM||t.slice(0,7);const sel=S.ui.calD&&S.ui.calD.slice(0,7)===mk?S.ui.calD:(mk===t.slice(0,7)?t:mk+"-01");
  const first=parseD(mk+"-01"),off=(first.getDay()+6)%7,start=addDays(mk+"-01",-off);
  const map=calItems(start,42),L=LIM();
  const cells=[...Array(42)].map((_,i)=>{const ds=addDays(start,i),its=map[ds]||[],inM=ds.slice(0,7)===mk;
    const deb=its.filter(x=>x.kind&&!x.done);const over=deb.filter(x=>x.kind==="debo").length>L.d;
    const colors=[...new Set(its.map(x=>x.c))].slice(0,3);
    return`<button class="cal-d${inM?"":" out"}${ds===t?" today":""}${ds===sel?" sel":""}" data-act="calDay" data-v="${ds}"><span>${+ds.slice(8)}</span><i>${colors.map(c=>`<b style="background:${c}"></b>`).join("")}</i>${over?'<em title="Pasa tu máximo">!</em>':""}</button>`}).join("");
  const its=map[sel]||[];const dd=parseD(sel);
  return`<div class="card cal" data-cal>
    <div class="between"><button class="cal-nav" data-act="calMove" data-v="-1" aria-label="Mes anterior">‹</button><div class="b" style="font-size:18px">${MES[first.getMonth()]} ${first.getFullYear()}</div><button class="cal-nav" data-act="calMove" data-v="1" aria-label="Mes siguiente">›</button></div>
    <div class="cal-g cal-h">${["Lu","Ma","Mi","Ju","Vi","Sá","Do"].map(d=>`<span>${d}</span>`).join("")}</div>
    <div class="cal-g">${cells}</div>
    ${mk!==t.slice(0,7)?'<div style="text-align:center;margin-top:6px"><button class="link" data-act="calToday">Ir a hoy</button></div>':""}
  </div>
  <h2 class="sec">${sel===t?"Hoy":["domingo","lunes","martes","miércoles","jueves","viernes","sábado"][dd.getDay()]+" "+dd.getDate()+" de "+MONTHS[dd.getMonth()]}</h2>
  ${its.length?`<div class="list">${its.map(x=>`<div class="item${x.done?" done":""}" data-act="${x.act}" data-id="${x.id}"${x.v?` data-v="${x.v}"`:""}><span class="cal-t">${x.t||"—"}</span><div class="grow"><div class="t">${x.ic} ${esc(x.title)}</div></div></div>`).join("")}</div>`:`<div class="card empty">${ill()}Día libre. Nada programado.</div>`}
  <div class="btns" style="margin-top:12px"><button class="btn soft" data-act="newRemOn" data-d="${sel}">${icon("plus")}Aviso o evento</button><button class="btn ghost" data-act="calTask" data-v="${sel}">${icon("plus")}Tarea ese día</button></div>`;
}

/* ---------- Retos diarios: elegir una opción o progresivos ---------- */
const CH_RULES_DEF=[{upTo:100,inc:20},{upTo:200,inc:15},{upTo:300,inc:10},{upTo:null,inc:5}];
function chNext(c,v){const r=(c.rules||[]).find(x=>x.upTo==null||v<x.upTo)||{inc:0};let n=v+Number(r.inc||0);if(c.max&&n>c.max)n=Number(c.max);return n}
function chOn(c,ds){return(c.days||[0,1,2,3,4,5,6]).includes(parseD(ds).getDay())&&ds>=(c.from||ds)}
function chDone(c,ds){const l=(c.log||{})[ds];return!!l&&l.s==="done"}
// meta del día: sube cuando cumples (o cada día si advance==="daily"); en días futuros asume que cumples
function chTarget(c,ds){
  if(c.type!=="progressive")return null;
  let v=Number(c.start)||0,d=c.from||today();const t=today();
  for(let i=0;i<1500&&d<ds;i++){if(chOn(c,d)&&(c.advance==="daily"||chDone(c,d)||(d>=t&&!(c.log||{})[d])))v=chNext(c,v);d=addDays(d,1)}
  return v;
}
function chStreak(c){let n=0,d=today();if(!chDone(c,d))d=addDays(d,-1);for(let i=0;i<400&&d>=(c.from||d);i++){if(chOn(c,d)){if(chDone(c,d))n++;else break}d=addDays(d,-1)}return n}
function chAsk(c,ds){if(c.type==="choice")return"¿Hiciste "+(c.options||[]).map(o=>o.toLowerCase()).join(" o ")+"?";const n=chTarget(c,ds);return`Hoy te tocan ${n} ${c.unit||""}`.trim()}
function chPending(){const t=today();return(S.challenges||[]).filter(c=>chOn(c,t)&&!(c.log||{})[t])}
function chLog(id,entry){const c=(S.challenges||[]).find(x=>x.id===id);if(!c)return;const t=today();c.log=c.log||{};c.log[t]={...entry,ts:Date.now(),target:chTarget(c,t)};if(entry.s==="done"){celebrate&&celebrate();const n=chStreak(c);toast(n>1?`🔥 ${n} días seguidos`:"¡Hecho! 💪")}else toast("Anotado");save();render()}
function chRow(c,ds=today()){
  const l=(c.log||{})[ds],st=chStreak(c),tg=chTarget(c,ds);
  const head=`<div class="between"><div style="min-width:0" data-act="editChal" data-id="${c.id}"><div class="b">${esc(c.icon||"💪")} ${esc(c.name)}</div><div class="muted small">${c.type==="progressive"?`Hoy: <b>${tg} ${esc(c.unit||"")}</b>`:esc((c.options||[]).join(" · "))}${st?` · 🔥 ${st}`:""}</div></div></div>`;
  let body;
  if(l)body=`<div class="small" style="margin-top:8px">${l.s==="done"?"✅ "+(l.opt?esc(l.opt):l.n!=null?`${l.n} ${esc(c.unit||"")}`:"Hecho"):l.s==="partial"?`🟡 ${l.n} de ${l.target} ${esc(c.unit||"")} (mañana se repite la meta)`:"⏸️ Hoy no"} <button class="link" data-act="chalUndo" data-id="${c.id}">Cambiar</button></div>`;
  else if(c.type==="choice")body=`<div class="btns" style="margin-top:10px">${(c.options||[]).map((o,i)=>`<button class="btn sm soft" data-act="chalDo" data-id="${c.id}" data-v="${i}">✓ ${esc(o)}</button>`).join("")}<button class="btn sm ghost" data-act="chalSkip" data-id="${c.id}">Hoy no</button></div>`;
  else body=`<div class="btns" style="margin-top:10px"><button class="btn sm soft" data-act="chalDo" data-id="${c.id}">✓ Hice ${tg}</button><button class="btn sm ghost" data-act="chalLess" data-id="${c.id}">Hice menos</button><button class="btn sm ghost" data-act="chalSkip" data-id="${c.id}">Hoy no</button></div>`;
  return`<div class="card${l&&l.s==="done"?" tint-sage":""}">${head}${body}</div>`;
}
function chPreview(c){if(c.type!=="progressive")return"";const t=today();const days=[];let d=t;for(let i=0;i<60&&days.length<7;i++){if(chOn(c,d))days.push(`${DOW[parseD(d).getDay()]} ${chTarget(c,d)}`);d=addDays(d,1)}return days.join(" · ")}
function viewRetos(){
  const L=S.challenges||[];
  return`<h2 class="sec">Retos diarios <button class="link" data-act="newChal">+ Nuevo</button></h2>
  ${L.length?L.map(c=>chRow(c)).join(""):`<div class="card empty">${ill()}Un reto diario te pregunta cada día si lo hiciste. Puede ser “trote o cuerda” o unas flexiones que suben solas.<div class="btns" style="justify-content:center;margin-top:10px"><button class="btn sm soft" data-act="chalTpl" data-v="cardio">🏃 Trote o cuerda</button><button class="btn sm soft" data-act="chalTpl" data-v="flex">💪 Flexiones progresivas</button></div></div>`}`;
}

};
const rulesText=r=>(r||[]).map(x=>x.upTo==null?`Después: +${x.inc}`:`Hasta ${x.upTo}: +${x.inc}`).join("\n");
function parseRules(s){return String(s||"").split("\n").map(l=>l.match(/\d+/g)).filter(Boolean).map(n=>n.length>=2?{upTo:+n[0],inc:+n[1]}:{upTo:null,inc:+n[0]}).sort((a,b)=>(a.upTo??1e9)-(b.upTo??1e9))}
function challengeForm(c,tpl){

  openSheet({title:isNew?"Nuevo reto diario":"Editar reto",html:`

function chVoice(text){
  const f=XV.fold(text);if(!/\b(hice|termine|complete|ya hice|hoy no)\b/.test(f))return null;
  const L=S.challenges||[];const w=s=>XV.fold(s).split(/\W+/).filter(x=>x.length>3);
  for(const c of L){
    const opt=(c.options||[]).findIndex(o=>w(o).some(x=>f.includes(x)));
    const hit=opt>=0||w(c.name).some(x=>f.includes(x))||(c.unit&&w(c.unit).some(x=>f.includes(x.slice(0,-1))));
    if(!hit)continue;
    if(/\bhoy no\b|\bno hice\b/.test(f)){chLog(c.id,{s:"skip"});return`Anotado: hoy no hiciste ${c.name.toLowerCase()}.`}
    if(c.type==="choice"){const o=c.options[Math.max(0,opt)];chLog(c.id,{s:"done",opt:o});return`¡Bien! Anoté ${o.toLowerCase()}. Racha: ${chStreak(c)} días.`}
    const tg=chTarget(c,today()),n=Number((f.match(/\d+/)||[tg])[0]);
    chLog(c.id,n>=tg?{s:"done",n}:{s:"partial",n});
    return n>=tg?`¡Bien! ${n} ${c.unit}. Mañana te tocan ${chTarget(c,addDays(today(),1))}.`:`Anoté ${n} de ${tg}. Mañana repites la meta de ${tg}.`;
  }
  return null;
}

  const now=Date.now(),tz=TZ();

    const p=XV.parseAdd(text,now,tz);

    const tasks=S.tasks.filter(x=>!x.done&&x.due).map(x=>({title:x.title,due:x.due,kind:x.kind}));

function schedule(days=45){
  const now=Date.now(),end=now+days*864e5,out=[],t=today();
  const add=(id,at,title,body,tab)=>{if(at>=now-36e5*12&&at<=end)out.push({id,at,title,body,tab})};
  S.tasks.forEach(x=>{if(!x.done&&x.remindAt)add("t:"+x.id,new Date(x.remindAt).getTime(),"Recordatorio",x.title,"planear")});
  S.reminders.forEach(r=>{if(r.done)return;nextOcc(r,now).forEach(at=>add(`c:${r.id}:${at}`,at,r.kind==="evento"?"📅 "+r.title:"🔔 "+r.title,r.notes||(r.kind==="evento"?"Evento ahora":"Recordatorio"),"planear"))});
  for(let i=0;i<days;i++){
    const ds=addDays(t,i),dow=parseD(ds).getDay();
    S.routines.forEach(r=>{if(r.time&&r.days.includes(dow)&&!(i===0&&routineDoneOn(r,ds)))add(`r:${r.id}:${ds}`,atOn(ds,r.time),"🌱 "+r.name,`${r.steps.length} pasos · ${r.steps.reduce((a,s)=>a+Number(s.min||0),0)} min`,"planear")});
    const l=dayLoad(ds);
    if(S.settings.digest&&(l.d||l.s))add("dg:"+ds,atOn(ds,S.settings.digest),i===0?"☀️ Tu día":"☀️ Plan del día",`${l.d} Debo · ${l.s} Debería: ${l.list.sort(sortTasks).slice(0,3).map(x=>x.title).join(", ")}`,"hoy");
    const dd=parseD(ds).getDate();
    S.goals.forEach(g=>{if(g.remindDay&&Number(g.remindDay)===dd&&goalStats(g).pct<1){const st=goalStats(g);add(`g:${g.id}:${ds.slice(0,7)}`,atOn(ds,"09:00"),"💰 Aporte: "+g.name,st.perMonth?"Aporte sugerido este mes. Toca para registrarlo.":"Toca para registrar tu aporte","dinero")}});
    (S.challenges||[]).forEach(c=>{if(!chOn(c,ds)||(c.log||{})[ds])return;add(`ch:${c.id}:${ds}`,atOn(ds,c.time||"07:00"),(c.icon||"💪")+" "+c.name,chAsk(c,ds),"hoy");if(c.remind2)add(`ch2:${c.id}:${ds}`,atOn(ds,c.remind2),(c.icon||"💪")+" ¿Ya lo hiciste?",chAsk(c,ds),"hoy")});
    if(dow===0)add("rit:"+ds,atOn(ds,"19:00"),"🗓️ Ritual semanal","15 minutos para planear tu semana","planear");
  }
  S.pays.forEach(p=>{const n=payNext(p);if(!n)return;add(`p2:${p.id}:${n.mk}`,atOn(addDays(n.ds,-2),"09:00"),"💳 Pago en 2 días",p.name,"dinero");add(`p0:${p.id}:${n.mk}`,atOn(n.ds,"08:00"),"💳 Hoy pagas: "+p.name,p.amount?"Toca para marcarlo como pagado":"","dinero")});
  S.research.forEach(r=>{if(r.status==="lista"&&r.reviewAt)add("rv:"+r.id,atOn(r.reviewAt,"09:00"),"🔎 Revisa tu investigación",r.topic,"asistente")});
  return out.sort((a,b)=>a.at-b.at);
}

function b64uToBytes(b){const p="=".repeat((4-b.length%4)%4);const s=atob((b+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(s,c=>c.charCodeAt(0))}
async function connectPush(out){

    if(!S.pushId)S.pushId=uid().replace(/[^\w-]/g,"").slice(0,32);
    const r=await fetch(url+"/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:S.pushId,sub:sub.toJSON()})});
    if(!r.ok)throw new Error("registro "+r.status);

}

/* Calendario (.ics): avisos fiables aunque la app esté cerrada */
function icsDate(d){return`${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`}
function downloadIcs({title,start,rrule,notes,minutes=15}){
  const end=new Date(start.getTime()+minutes*6e4);
  const e=s=>String(s||"").replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Xevapp//ES","CALSCALE:GREGORIAN","BEGIN:VEVENT",`UID:${uid()}@xevapp`,`DTSTAMP:${icsDate(new Date())}`,`DTSTART:${icsDate(start)}`,`DTEND:${icsDate(end)}`,`SUMMARY:${e(title)}`,notes?`DESCRIPTION:${e(notes)}`:"",rrule?`RRULE:${rrule}`:"","BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${e(title)}`,"TRIGGER:-PT0M","END:VALARM","END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n");
  download(`${title.replace(/[^\w\- ]+/g,"").slice(0,40)||"xevapp"}.ics`,ics,"text/calendar");
  toast("Abre el archivo y toca “Añadir” para guardarlo en tu Calendario",4000);
}
function download(name,content,type){
  try{const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},4000)}catch{toast("No se pudo descargar aquí")}
}
async function copy(text){try{await navigator.clipboard.writeText(text);toast("Copiado")}catch{toast("No se pudo copiar")}}

function onboarding(){
  const el=document.createElement("div");el.className="onb";document.body.appendChild(el);
  let step=0;const data={name:"",currency:"COP",focus:"orden"};
  const pages=[
    ()=>`<div class="logo">X</div><h1>Bienvenido a Xevapp</h1><p class="muted">Tu vida, tu dinero y tu negocio en un solo lugar.</p>
      ${[["🗓️","var(--blue-s)","Hoy y Planear","Rutinas, lo que debes y lo que deberías, listas y contenido."],["💰","var(--sage-s)","Dinero","Metas de ahorro con aportes sugeridos y presupuesto."],["🧭","var(--lav-s)","Negocio","Ideas evaluadas, pendientes y cómo preguntarle a cada persona."],["✨","var(--sand-s)","Asistente","8 agentes de IA gratuitos que conocen tu contexto."]].map(([i,b,t,d])=>`<div class="feat"><i style="background:${b}">${i}</i><div><div class="b">${t}</div><div class="muted small">${d}</div></div></div>`).join("")}`,
    ()=>`<h1>Cuéntame de ti</h1><p class="muted">Opcional. Puedes cambiarlo luego.</p>${fld("¿Cómo te llamo?",`<input class="inp" id="ob-name" value="${esc(data.name)}" placeholder="Tu nombre">`)}${fld("Moneda",`<select class="inp" id="ob-cur">${["COP","USD","EUR","MXN","PEN","CLP","ARS"].map(c=>`<option ${c===data.currency?"selected":""}>${c}</option>`).join("")}</select>`)}
      <div class="field"><span>¿Qué quieres ordenar primero?</span><div class="chips" style="flex-wrap:wrap">${[["orden","Mi día"],["rutina","Rutinas"],["ahorro","Ahorro"],["negocio","Negocio"]].map(([k,l])=>`<button class="chip ${data.focus===k?"on":""}" data-f="${k}">${l}</button>`).join("")}</div></div>`,
    ()=>`<h1>Instálala en tu iPhone</h1><p class="muted">Así funciona a pantalla completa, sin conexión y con avisos.</p><ol class="steps" style="margin:18px 0"><li>Abre esta página en <b>Safari</b>.</li><li>Toca <b>Compartir</b> (cuadro con flecha hacia arriba).</li><li>Elige <b>Añadir a pantalla de inicio</b>.</li><li>Abre Xevapp desde el ícono y activa las notificaciones en Ajustes.</li></ol><div class="note">Tus datos se guardan solo en este dispositivo. Exporta un respaldo de vez en cuando desde Ajustes.</div>`
  ];
  const paint=()=>{
    el.innerHTML=`<div style="flex:1">${pages[step]()}</div><div class="pdots">${pages.map((_,i)=>`<i class="${i===step?"on":""}"></i>`).join("")}</div>
    ${step<2?`<button class="btn block" data-n>Continuar</button>`:`<button class="btn block" data-seed>Empezar con ejemplos</button><button class="btn block ghost" style="margin-top:8px" data-empty>Empezar vacío</button>`}`;
    const g=G();const oh=el.querySelector("h1");oh&&revealTitle(oh);g&&g.fromTo([...el.firstElementChild.children].filter(c=>c!==oh),{y:22,opacity:0},{y:0,opacity:1,stagger:.07,duration:.7,ease:"expo.out",delay:.1});
    $$("[data-f]",el).forEach(b=>b.onclick=()=>{collect();data.focus=b.dataset.f;paint()});
    $("[data-n]",el)&&($("[data-n]",el).onclick=()=>{collect();step++;paint()});
    const finish=withSeed=>{collect();S.profile.name=data.name;S.settings.currency=data.currency;if(withSeed)seed(data.focus);S.onboarded=true;saveNow();const g=G();const go=()=>{el.remove();render({anim:true})};g?g.to(el,{opacity:0,y:-20,duration:.35,onComplete:go}):go()};
    $("[data-seed]",el)&&($("[data-seed]",el).onclick=()=>finish(true));
    $("[data-empty]",el)&&($("[data-empty]",el).onclick=()=>finish(false));
  };
  const collect=()=>{const n=$("#ob-name",el),c=$("#ob-cur",el);if(n)data.name=n.value.trim();if(c)data.currency=c.value};
  paint();
}

async function registerSW(){
  try{
    if(!("serviceWorker" in navigator)){PREVIEW=true;return}
    swReg=await navigator.serviceWorker.register("sw.js");
  }catch(e){PREVIEW=true}
}
function detectSandbox(){
  // Dentro de la vista previa de Claude la página corre en un iframe aislado
  try{if(window.top!==window.self)PREVIEW=true}catch{PREVIEW=true}
}
(async function init(){
  load();applyTheme();detectSandbox();
  render({anim:true});
  if(!S.onboarded)onboarding();
  else if(isIOS&&standalone()&&setupStatus().done<4&&S.ui.setupSeen!==1){S.ui.setupSeen=1;save();setTimeout(setupSheet,900)}
  await registerSW();
  if(PREVIEW&&S.ui.tab==="asistente")render();
  mountFab();
  const qs=new URLSearchParams(location.search);
  if(qs.has("q")||qs.has("voz")){const qq=qs.get("q");try{history.replaceState(null,"",location.pathname)}catch{}xevaOpen(qq?{q:qq}:{listen:true})}
  await importVoice();
  checkReminders();
  maybeCheckin();
  rollDay();setInterval(()=>{rollDay();importVoice();checkReminders()},20000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake();else saveNow()});
  window.addEventListener("pageshow",e=>{if(e.persisted)wake()});
  window.addEventListener("focus",()=>rollDay());
  armMidnight();
  window.addEventListener("pagehide",saveNow);
  // cambio de día con la app abierta
  let lastDay=today();setInterval(()=>{if(today()!==lastDay){lastDay=today();render()}},60000);
})();
